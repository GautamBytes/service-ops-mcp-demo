[project]
name = "service-ops-mcp-demo"
version = "0.1.0"
description = "A read-only Zoho CRM and QuickBooks MCP integration demo."
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx==0.28.1"]

[dependency-groups]
dev = ["pytest>=9.2,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service_ops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
